<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عيادة البسمة NDC لطب وجراحة الفم والأسنان - د. وفاء السميعي و د. علي النقيب</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Cairo', sans-serif; }
  @media print {
    body * { visibility: hidden; }
    #printableArea, #printableArea * { visibility: visible; }
    #printableArea { position: absolute; left: 0; top: 0; width: 100%; display: block !important; background: white; }
    .no-print { display: none !important; }
  }
  .clinic-logo svg, .clinic-logo img { width: 100%; height: 100%; display: block; object-fit: cover; }
  .dental-arch { width: 100%; height: auto; display: block; }
  .tooth { cursor: pointer; }
  .tooth .crown { fill: url(#toothGrad); stroke: #94a3b8; stroke-width: 0.9; transition: all .18s ease; }
  .tooth .shine { fill: #fff; opacity: .55; pointer-events: none; }
  .tooth .num { font-family: 'Cairo', sans-serif; font-size: 7.5px; font-weight: 800; fill: #475569; pointer-events: none; text-anchor: middle; }
  .tooth:hover .crown { fill: url(#toothGradHover); stroke: #6366f1; }
  .tooth.selected .crown { fill: url(#toothGradSel); stroke: #1e3a8a; stroke-width: 1.3; }
  .tooth.selected .shine { opacity: .25; }
  .tooth.selected .num { fill: #fff; }
  .gum { fill: url(#gumGrad); opacity: .9; }
  .ai-glow { background: linear-gradient(135deg, #a855f7 0%, #6366f1 50%, #06b6d4 100%); background-size: 200% 200%; animation: aiglow 3s ease infinite; }
  @keyframes aiglow { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  .ai-typing::after { content: '...'; animation: dots 1.4s infinite; }
  @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }
  .ai-result-box { animation: fadeSlide .4s ease; }
  @keyframes fadeSlide { from{opacity:0; transform: translateY(8px);} to{opacity:1; transform: translateY(0);} }
  #lightbox img { max-width: 100%; max-height: 100%; }
  .canvas-container { position: relative; display: inline-block; cursor: crosshair; max-width: 100%; }
  .canvas-container img { display: block; max-width: 100%; height: auto; }
  .canvas-container canvas { position: absolute; top: 0; left: 0; pointer-events: none; }
  .ref-table { font-size: 10px; width: 100%; border-collapse: collapse; }
  .ref-table th { background: #1e3a8a; color: #fff; padding: 4px 6px; font-weight: 700; }
  .ref-table td { padding: 3px 6px; border-bottom: 1px solid #e5e7eb; }
  .ref-table tr:nth-child(even) { background: #f8fafc; }
  .ref-table .ok { color: #059669; font-weight: 700; }
  .pulse-badge { animation: pulseBadge 2s ease infinite; }
  @keyframes pulseBadge { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  
  /* تنسيقات الشعار الجديد */
  .ndc-logo-svg {
    filter: drop-shadow(0 0 15px rgba(251, 191, 36, 0.8)) drop-shadow(0 0 30px rgba(217, 119, 6, 0.5));
    animation: glowPulse 3s infinite alternate;
  }
  @keyframes glowPulse {
    0% { filter: drop-shadow(0 0 10px rgba(251, 191, 36, 0.6)) drop-shadow(0 0 20px rgba(217, 119, 6, 0.4)); }
    100% { filter: drop-shadow(0 0 20px rgba(251, 191, 36, 1)) drop-shadow(0 0 40px rgba(217, 119, 6, 0.8)); }
  }
  .wall-panel {
    background-color: #1a1a1a;
    background-image: 
      linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 50px 50px;
    box-shadow: inset 0 0 100px rgba(0,0,0,0.9);
  }
</style>
</head>
<body class="bg-gray-50 text-gray-800 p-2">

<div id="loginOverlay" class="fixed inset-0 bg-blue-950 flex items-center justify-center z-50 p-4">
  <div class="bg-white p-6 rounded-2xl shadow-xl max-w-sm w-full text-center space-y-4 border border-blue-100">
    <div class="w-24 h-24 mx-auto mb-2 clinic-logo rounded-2xl overflow-hidden shadow-lg shadow-blue-200"></div>
    <h2 class="text-lg font-bold text-blue-900">تسجيل الدخول</h2>
    <p class="text-xs text-gray-600">أدخل بيانات حسابك</p>
    <div class="text-right space-y-2">
      <label class="text-[11px] font-bold text-gray-700 block">👤 اسم المستخدم</label>
      <input type="text" id="loginUsername" placeholder="مثال: drali" class="w-full p-2.5 border rounded-xl text-sm text-center bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-600" autocomplete="username">
      <label class="text-[11px] font-bold text-gray-700 block">🔑 كلمة المرور</label>
      <input type="password" id="loginPassword" placeholder="••••••••" class="w-full p-2.5 border rounded-xl text-sm text-center bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-600" autocomplete="current-password">
    </div>
    <button onclick="login()" id="loginBtn" class="w-full bg-blue-600 text-white p-2.5 rounded-xl text-sm font-bold shadow hover:bg-blue-700">دخول النظام</button>
    <p id="loginError" class="text-xs text-red-600 hidden font-semibold"></p>
  </div>
</div>

<div class="w-full max-w-7xl mx-auto bg-white min-h-screen shadow-lg flex flex-col p-2 md:p-5 rounded-xl border border-gray-100">
  <div id="userBar" class="hidden bg-gradient-to-r from-emerald-600 to-teal-600 text-white rounded-xl p-3 mb-3 flex items-center justify-between shadow flex-wrap gap-2">
    <div class="flex items-center gap-2"><span class="text-2xl">👤</span><div><p id="userBarName" class="text-sm font-bold">-</p><p id="userBarRole" class="text-[10px] opacity-90">-</p></div></div>
    <div class="flex items-center gap-2 flex-wrap">
      <button onclick="openPatientsList()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/30">📋 المرضى</button>
      <button onclick="openImagesArchive()" class="bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/30">🖼️ الأرشيف</button>
      <button onclick="openChatList()" class="relative bg-white/20 hover:bg-white/30 text-white px-3 py-1.5 rounded-lg text-[11px] font-bold border border-white/30">
        💬 دردشة
        <span id="chatUnreadBadge" class="hidden absolute -top-1 -right-1 bg-red-500 text-white text-[9px] font-bold rounded-full min-w-[18px] h-[18px] flex items-center justify-center px-1 pulse-badge">0</span>
      </button>
      <button onclick="openCreateGroupModal()" class="bg-white/20 hover:bg-white/30 text-white px-2 py-1.5 rounded-lg text-[11px] font-bold border border-white/30" title="إنشاء مجموعة">👥+</button>
